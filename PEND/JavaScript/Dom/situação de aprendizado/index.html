<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <!--Título inicial da página-->
  <h2>🩷Cadastro de Usuário🌺</h2>

  <!--Formulário de cadastro.-->
  <form id="form">
    <!--Campo de entrada para o nome do usuário, com um elemento <small> para exibir mensagens de erro relacionadas ao nome.-->
    <div>
      <input type="text" id="nome" placeholder="Nome">
      <small id="erroNome"></small>
    </div>

    <!--Campo de entrada para o email do usuário, com um elemento <small> para exibir mensagens de erro relacionadas ao email.
     A validação do email é feita usando uma expressão regular para verificar se o formato do email é válido.-->
    <div>
      <input type="email" id="email" placeholder="Email">
      <small id="erroEmail"></small>
    </div>

    <!--Campo de entrada para a senha do usuário, com um ícone de olho para mostrar ou esconder a senha e um elemento <small> para exibir mensagens de erro relacionadas à senha.-->
    <div>
      <input type="password" id="senha" placeholder="Digite a senha">
      <i class="bi bi-eye-fill icone" id="botaosenha"></i>

      <!-- Mensagem de erro da senha -->
      <small id="erroSenha"></small>
    </div>

    <!--Campo de entrada para o telefone do usuário, com um elemento <small> para exibir mensagens de erro relacionadas ao telefone.
      A validação do telefone é feita usando uma expressão regular para verificar se ele contém apenas números e tem entre 8 e 15 dígitos.-->
    <div>
      <input type="text" id="telefone" placeholder="Telefone">
      <small id="erroTelefone"></small>
    </div>

    <!--Campo de entrada para o endereço do usuário, com um elemento <small> para exibir mensagens de erro relacionadas ao endereço.
      A validação do endereço é feita verificando se ele não está vazio.-->
    <div>
      <input type="text" id="endereco" placeholder="Endereço">
      <small id="erroEndereco"></small>
    </div>

    <!--Botão de envio do formulário para cadastrar o usuário.
     Quando o formulário é enviado, a função de validação é chamada para verificar se os dados inseridos são válidos antes de permitir o envio do formulário.-->
    <button type="submit">Cadastrar</button>

  </form>

  <!--Elemento para exibir mensagens de sucesso ou erro após a validação do formulário.
   Ele é atualizado dinamicamente com base no resultado da validação, mostrando mensagens apropriadas para o usuário.-->
  <p id="mensagem"></p>

  <script src="script.js"></script>

</body>
</html>
