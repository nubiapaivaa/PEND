<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="conteudo"></div>

    <div id="mensagem"></div>

    <img id="foto" />

    <!-- Retorna o valor do atributo -->
    <a id="link" href="https://www.youtube.com/watch?v=pcS1-XSjzG8&list=PLuM1cDb0L3BKJnhldrip-TidwMNO_6cD-">Visite o site</a>

    <!-- define o valor de uma propriedade CSS -->
    <div id="caixa">Texto</div>

    <!--Adiciona uma classe CSS-->
    <div id="alerta">✨ALERTA!🌺</div>

    <!--Remove uma classe CSS-->
    <div id="alert" class="destaque oculto">AVISO💡</div>

    <!--Cria um elemento HTML dinamicamente-->
    <div id="container"></div>

    <!--Adiciona um novo elemento como filho de um existente-->
    <ul id="lista"></ul>

    <!--remove um elemento filho de um elemento existente-->
    <ul id="list">
        <li id="item1">Item 1</li>
    </ul>
</body>
</html>
