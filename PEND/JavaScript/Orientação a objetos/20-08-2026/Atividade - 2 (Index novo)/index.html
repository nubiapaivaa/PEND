<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1 id="titulo">Cadastro e Exibição de Produtos</h1>

        <label for="nome">Nome do produto:</label>
        <input id="nome" type="text" placeholder="Nome do produto">

        <label for="preco">Preço:</label>
        <input id="preco" type="number" placeholder="Preço">

        <label for="categoria">Categoria:</label>
        <input id="categoria" type="text" placeholder="Categoria">

        <label for="desconto">Desconto (%):</label>
        <input id="desconto" type="number" placeholder="Desconto (%)">

        <button id="botaoCadastrar">Cadastrar</button>

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
