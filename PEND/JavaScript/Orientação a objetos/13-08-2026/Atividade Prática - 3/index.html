<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
</head>

<body>

    <h1 id="titulo">Cadastro e Exibição de Produtos</h1>

    <div>
        <input id="nome" type="text" placeholder="Nome do produto">

        <input id="preco" type="number" placeholder="Preço">

        <input id="categoria" type="text" placeholder="Categoria">

        <input id="desconto" type="number" placeholder="Desconto (%)">

        <button id="botaoCadastrar">
            Cadastrar
        </button>
    </div>

    <div id="resultado"></div>

    <script src="script.js"></script>

</body>

</html>
