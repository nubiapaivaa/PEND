<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Cadastro de Produto</h1>

        <form id="formProduto">

            <label for="nome">Nome do produto:</label>
            <input type="text" id="nome" placeholder="Digite o nome" required>

            <label for="preco">Preço:</label>
            <input type="number" id="preco" placeholder="Digite o preço" step="0.01" min="0" required>

            <label for="categoria">Categoria:</label>
            <select id="categoria" required>
                <option value="">Selecione uma categoria</option>
                <option value="Eletrônicos">Eletrônicos</option>
                <option value="Roupas">Roupas</option>
                <option value="Alimentos">Alimentos</option>
                <option value="Beleza">Beleza</option>
                <option value="Outros">Outros</option>
            </select>

            <label for="desconto">Desconto (%):</label>
            <input type="number" id="desconto" placeholder="Ex: 10" min="0" max="100" required>

            <button type="submit">Cadastrar Produto</button>

        </form>

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
